<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFINETT — Life Agent</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #e2e2f0;
    --muted: #6b6b88;
    --radius: 12px;
    --font: 'Inter', system-ui, sans-serif;
  }

  body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; display: flex; overflow: hidden; }

  /* Sidebar */
  nav {
    width: 220px; min-width: 220px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px 12px; gap: 4px;
  }
  .logo { font-size: 18px; font-weight: 700; color: var(--accent2); padding: 8px 12px 20px; letter-spacing: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
    cursor: pointer; font-size: 14px; color: var(--muted); transition: all 0.15s; border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(124,106,247,0.15); color: var(--accent2); }
  .nav-item .icon { font-size: 18px; width: 22px; text-align: center; }

  /* Main */
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 28px; display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 18px; font-weight: 600; }
  .topbar .date { font-size: 13px; color: var(--muted); }

  .content { flex: 1; overflow-y: auto; padding: 28px; }

  /* Views */
  .view { display: none; }
  .view.active { display: block; }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 20px;
  }
  .card-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }

  /* Stats row */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px;
  }
  .stat-value { font-size: 32px; font-weight: 700; color: var(--accent2); }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat-card.red .stat-value { color: var(--red); }
  .stat-card.green .stat-value { color: var(--green); }
  .stat-card.yellow .stat-value { color: var(--yellow); }

  /* Report */
  .report-text {
    font-size: 15px; line-height: 1.7; color: var(--text); white-space: pre-wrap;
    background: var(--surface2); border-radius: 8px; padding: 18px;
  }
  .report-loading { color: var(--muted); font-style: italic; font-size: 14px; }

  /* Tasks */
  .tasks-toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: none; color: var(--muted); font-size: 13px; cursor: pointer; transition: all 0.15s;
  }
  .filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent2); background: rgba(124,106,247,0.1); }

  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-item {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px;
    transition: border-color 0.15s;
  }
  .task-item:hover { border-color: var(--accent); }
  .task-item.completed { opacity: 0.5; }
  .task-check {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border);
    cursor: pointer; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .task-check:hover { border-color: var(--green); }
  .task-check.done { background: var(--green); border-color: var(--green); }
  .task-check.done::after { content: '✓'; color: #fff; font-size: 11px; }
  .task-body { flex: 1; }
  .task-title { font-size: 14px; font-weight: 500; }
  .task-item.completed .task-title { text-decoration: line-through; color: var(--muted); }
  .task-meta { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .badge {
    padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase;
  }
  .badge.high { background: rgba(248,113,113,0.15); color: var(--red); }
  .badge.medium { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .badge.low { background: rgba(52,211,153,0.15); color: var(--green); }
  .task-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px;
    padding: 2px 4px; border-radius: 4px; transition: color 0.15s;
  }
  .icon-btn:hover { color: var(--text); }
  .icon-btn.danger:hover { color: var(--red); }

  /* Forms / modals */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 28px; width: 480px; max-width: 95vw;
  }
  .modal h2 { font-size: 16px; margin-bottom: 20px; }

  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  input, textarea, select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-size: 14px; font-family: var(--font);
    transition: border-color 0.15s; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; }
  select option { background: var(--surface2); }

  .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn {
    padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
    border: none; transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-add {
    position: fixed; bottom: 32px; right: 32px; width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 24px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(124,106,247,0.4);
    transition: all 0.15s; z-index: 50;
  }
  .btn-add:hover { background: var(--accent2); transform: scale(1.05); }

  /* Reminders */
  .reminder-item {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 8px;
    transition: border-color 0.15s;
  }
  .reminder-item:hover { border-color: var(--accent); }
  .reminder-item.triggered { opacity: 0.45; }
  .reminder-icon { font-size: 20px; }
  .reminder-body { flex: 1; }
  .reminder-title { font-size: 14px; font-weight: 500; }
  .reminder-time { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .overdue-badge { font-size: 11px; background: rgba(248,113,113,0.15); color: var(--red); padding: 2px 8px; border-radius: 4px; }

  /* Research */
  .research-form { display: flex; gap: 10px; margin-bottom: 20px; }
  .research-form input { flex: 1; }
  .research-entry {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 18px;
    margin-bottom: 14px;
  }
  .research-query { font-size: 13px; font-weight: 600; color: var(--accent2); margin-bottom: 10px; }
  .research-summary { font-size: 14px; line-height: 1.7; white-space: pre-wrap; color: var(--text); }
  .research-date { font-size: 11px; color: var(--muted); margin-top: 10px; }
  .research-loading {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 30px;
    text-align: center; color: var(--muted); font-size: 14px;
  }
  .spinner {
    display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Chat */
  .chat-container { display: flex; flex-direction: column; height: calc(100vh - 130px); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 4px 0 20px; display: flex; flex-direction: column; gap: 12px; }
  .chat-msg { display: flex; gap: 10px; max-width: 85%; }
  .chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .chat-msg.assistant { align-self: flex-start; }
  .msg-bubble {
    padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap;
  }
  .chat-msg.user .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .chat-msg.assistant .msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; background: var(--surface2); border: 1px solid var(--border); }
  .action-notice { font-size: 12px; color: var(--green); margin-top: 6px; background: rgba(52,211,153,0.08); padding: 6px 10px; border-radius: 6px; }

  .chat-input-row {
    display: flex; gap: 10px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .chat-input-row input { flex: 1; }
  .chat-input-row .btn { padding: 10px 20px; }

  /* Empty states */
  .empty { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 14px; }
  .empty .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<nav>
  <div class="logo">INFINETT</div>
  <button class="nav-item active" onclick="showView('dashboard', this)">
    <span class="icon">📊</span> Dashboard
  </button>
  <button class="nav-item" onclick="showView('tasks', this)">
    <span class="icon">✅</span> Tasks
  </button>
  <button class="nav-item" onclick="showView('reminders', this)">
    <span class="icon">🔔</span> Reminders
  </button>
  <button class="nav-item" onclick="showView('research', this)">
    <span class="icon">🔍</span> Research
  </button>
  <button class="nav-item" onclick="showView('chat', this)">
    <span class="icon">💬</span> AI Chat
  </button>
</nav>

<main>
  <div class="topbar">
    <h1 id="view-title">Dashboard</h1>
    <span class="date" id="topbar-date"></span>
  </div>

  <div class="content">

    <!-- Dashboard -->
    <div class="view active" id="view-dashboard">
      <div class="stats-row">
        <div class="stat-card"><div class="stat-value" id="stat-pending">—</div><div class="stat-label">Pending Tasks</div></div>
        <div class="stat-card red"><div class="stat-value" id="stat-overdue">—</div><div class="stat-label">Overdue</div></div>
        <div class="stat-card green"><div class="stat-value" id="stat-done">—</div><div class="stat-label">Completed</div></div>
        <div class="stat-card yellow"><div class="stat-value" id="stat-reminders">—</div><div class="stat-label">Reminders Today</div></div>
      </div>
      <div class="card">
        <div class="card-title">Today's Briefing</div>
        <div id="daily-report" class="report-loading">Generating your daily briefing...</div>
      </div>
    </div>

    <!-- Tasks -->
    <div class="view" id="view-tasks">
      <div class="tasks-toolbar">
        <button class="filter-btn active" onclick="filterTasks('all', this)">All</button>
        <button class="filter-btn" onclick="filterTasks('pending', this)">Pending</button>
        <button class="filter-btn" onclick="filterTasks('completed', this)">Completed</button>
        <button class="filter-btn" onclick="filterTasks('high', this)">High Priority</button>
      </div>
      <div class="task-list" id="task-list"></div>
    </div>

    <!-- Reminders -->
    <div class="view" id="view-reminders">
      <div id="reminder-list"></div>
    </div>

    <!-- Research -->
    <div class="view" id="view-research">
      <div class="research-form">
        <input type="text" id="research-input" placeholder="Ask anything to research... e.g. 'best sleep habits'" onkeydown="if(event.key==='Enter') doResearch()">
        <button class="btn btn-primary" onclick="doResearch()">Research</button>
      </div>
      <div id="research-list"></div>
    </div>

    <!-- Chat -->
    <div class="view" id="view-chat">
      <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
          <div class="chat-msg assistant">
            <div class="msg-avatar">🤖</div>
            <div class="msg-bubble">Hi! I'm your personal AI life agent. I can help you manage tasks, set reminders, research topics, and more. What would you like to do today?</div>
          </div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="Message your agent... (e.g. 'Add a task to call dentist tomorrow')" onkeydown="if(event.key==='Enter') sendChat()">
          <button class="btn btn-primary" onclick="sendChat()">Send</button>
        </div>
      </div>
    </div>

  </div>
</main>

<!-- Task Modal -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <h2 id="task-modal-title">Add Task</h2>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="task-title" placeholder="What needs to be done?">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="task-desc" placeholder="Optional details..."></textarea>
    </div>
    <div class="form-group">
      <label>Priority</label>
      <select id="task-priority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <div class="form-group">
      <label>Category</label>
      <input type="text" id="task-category" placeholder="e.g. Work, Health, Personal">
    </div>
    <div class="form-group">
      <label>Due Date</label>
      <input type="datetime-local" id="task-due">
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal('task-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()">Save</button>
    </div>
  </div>
</div>

<!-- Reminder Modal -->
<div class="modal-overlay" id="reminder-modal">
  <div class="modal">
    <h2>Add Reminder</h2>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="reminder-title" placeholder="Reminder title">
    </div>
    <div class="form-group">
      <label>Note</label>
      <textarea id="reminder-note" placeholder="Optional note..."></textarea>
    </div>
    <div class="form-group">
      <label>Date & Time</label>
      <input type="datetime-local" id="reminder-time">
    </div>
    <div class="form-group">
      <label>Repeat</label>
      <select id="reminder-repeat">
        <option value="">No repeat</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal('reminder-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveReminder()">Save</button>
    </div>
  </div>
</div>

<!-- FAB -->
<button class="btn-add" id="fab" onclick="openFab()">+</button>

<script>
const API = '';
let currentView = 'dashboard';
let taskFilter = 'all';
let allTasks = [];
let editingTaskId = null;

// ─── Navigation ───────────────────────────────────────────────────────────────
function showView(view, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  btn.classList.add('active');
  currentView = view;
  const titles = {dashboard:'Dashboard', tasks:'Tasks', reminders:'Reminders', research:'Research', chat:'AI Chat'};
  document.getElementById('view-title').textContent = titles[view];
  loadView(view);
}

function loadView(view) {
  if (view === 'dashboard') loadDashboard();
  else if (view === 'tasks') loadTasks();
  else if (view === 'reminders') loadReminders();
  else if (view === 'research') loadResearch();
  else if (view === 'chat') loadChat();
}

// ─── FAB ──────────────────────────────────────────────────────────────────────
function openFab() {
  if (currentView === 'tasks') openTaskModal();
  else if (currentView === 'reminders') openReminderModal();
  else if (currentView === 'research') document.getElementById('research-input').focus();
  else if (currentView === 'chat') document.getElementById('chat-input').focus();
  else openTaskModal();
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
async function loadDashboard() {
  try {
    const res = await fetch(API + '/api/reports/daily');
    const data = await res.json();
    document.getElementById('stat-pending').textContent = data.stats.pending_tasks;
    document.getElementById('stat-overdue').textContent = data.stats.overdue_tasks;
    document.getElementById('stat-done').textContent = data.stats.completed_tasks;
    document.getElementById('stat-reminders').textContent = data.stats.reminders_today;
    document.getElementById('daily-report').className = 'report-text';
    document.getElementById('daily-report').textContent = data.report;
  } catch (e) {
    document.getElementById('daily-report').textContent = 'Could not load report. Make sure your ANTHROPIC_API_KEY is set.';
  }
}

// ─── Tasks ────────────────────────────────────────────────────────────────────
async function loadTasks() {
  const res = await fetch(API + '/api/tasks');
  allTasks = await res.json();
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById('task-list');
  let tasks = allTasks;
  if (taskFilter === 'pending') tasks = tasks.filter(t => !t.completed);
  else if (taskFilter === 'completed') tasks = tasks.filter(t => t.completed);
  else if (taskFilter === 'high') tasks = tasks.filter(t => t.priority === 'high' && !t.completed);

  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>No tasks here. Hit + to add one.</div>';
    return;
  }
  list.innerHTML = tasks.map(t => `
    <div class="task-item ${t.completed ? 'completed' : ''}" id="task-${t.id}">
      <div class="task-check ${t.completed ? 'done' : ''}" onclick="toggleTask(${t.id}, ${!t.completed})"></div>
      <div class="task-body">
        <div class="task-title">${esc(t.title)}</div>
        <div class="task-meta">
          <span class="badge ${t.priority}">${t.priority}</span>
          ${t.category ? `<span>${esc(t.category)}</span>` : ''}
          ${t.due_date ? `<span>📅 ${fmtDate(t.due_date)}</span>` : ''}
          ${t.description ? `<span>${esc(t.description.substring(0, 60))}${t.description.length > 60 ? '…' : ''}</span>` : ''}
        </div>
      </div>
      <div class="task-actions">
        <button class="icon-btn" onclick="openTaskModal(${t.id})" title="Edit">✏️</button>
        <button class="icon-btn danger" onclick="deleteTask(${t.id})" title="Delete">🗑</button>
      </div>
    </div>
  `).join('');
}

function filterTasks(f, btn) {
  taskFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTasks();
}

async function toggleTask(id, completed) {
  await fetch(API + `/api/tasks/${id}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({completed}),
  });
  await loadTasks();
}

async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  await fetch(API + `/api/tasks/${id}`, {method: 'DELETE'});
  await loadTasks();
}

function openTaskModal(id) {
  editingTaskId = id || null;
  document.getElementById('task-modal-title').textContent = id ? 'Edit Task' : 'Add Task';
  if (id) {
    const t = allTasks.find(t => t.id === id);
    document.getElementById('task-title').value = t.title;
    document.getElementById('task-desc').value = t.description || '';
    document.getElementById('task-priority').value = t.priority;
    document.getElementById('task-category').value = t.category || '';
    document.getElementById('task-due').value = t.due_date ? t.due_date.substring(0, 16) : '';
  } else {
    document.getElementById('task-title').value = '';
    document.getElementById('task-desc').value = '';
    document.getElementById('task-priority').value = 'medium';
    document.getElementById('task-category').value = '';
    document.getElementById('task-due').value = '';
  }
  document.getElementById('task-modal').classList.add('open');
}

async function saveTask() {
  const title = document.getElementById('task-title').value.trim();
  if (!title) return alert('Title is required');
  const body = {
    title,
    description: document.getElementById('task-desc').value || null,
    priority: document.getElementById('task-priority').value,
    category: document.getElementById('task-category').value || null,
    due_date: document.getElementById('task-due').value || null,
  };
  if (editingTaskId) {
    await fetch(API + `/api/tasks/${editingTaskId}`, {
      method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
    });
  } else {
    await fetch(API + '/api/tasks', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
    });
  }
  closeModal('task-modal');
  await loadTasks();
}

// ─── Reminders ────────────────────────────────────────────────────────────────
async function loadReminders() {
  const res = await fetch(API + '/api/reminders');
  const reminders = await res.json();
  const list = document.getElementById('reminder-list');
  const now = new Date();
  if (reminders.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">🔔</div>No reminders yet. Hit + to add one.</div>';
    return;
  }
  list.innerHTML = reminders.map(r => {
    const t = new Date(r.remind_at);
    const overdue = !r.triggered && t < now;
    return `
      <div class="reminder-item ${r.triggered ? 'triggered' : ''}">
        <span class="reminder-icon">${r.triggered ? '✓' : overdue ? '⚠️' : '🔔'}</span>
        <div class="reminder-body">
          <div class="reminder-title">${esc(r.title)} ${overdue ? '<span class="overdue-badge">OVERDUE</span>' : ''}</div>
          <div class="reminder-time">${fmtDateTime(r.remind_at)}${r.repeat ? ` · repeats ${r.repeat}` : ''}${r.note ? ` · ${esc(r.note)}` : ''}</div>
        </div>
        <div class="task-actions">
          ${!r.triggered ? `<button class="icon-btn" onclick="markReminderDone(${r.id})" title="Mark done">✓</button>` : ''}
          <button class="icon-btn danger" onclick="deleteReminder(${r.id})" title="Delete">🗑</button>
        </div>
      </div>`;
  }).join('');
}

function openReminderModal() {
  document.getElementById('reminder-title').value = '';
  document.getElementById('reminder-note').value = '';
  document.getElementById('reminder-time').value = '';
  document.getElementById('reminder-repeat').value = '';
  document.getElementById('reminder-modal').classList.add('open');
}

async function saveReminder() {
  const title = document.getElementById('reminder-title').value.trim();
  const time = document.getElementById('reminder-time').value;
  if (!title || !time) return alert('Title and time are required');
  await fetch(API + '/api/reminders', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      title,
      note: document.getElementById('reminder-note').value || null,
      remind_at: new Date(time).toISOString(),
      repeat: document.getElementById('reminder-repeat').value || null,
    }),
  });
  closeModal('reminder-modal');
  await loadReminders();
}

async function markReminderDone(id) {
  await fetch(API + `/api/reminders/${id}`, {
    method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({triggered: true}),
  });
  await loadReminders();
}

async function deleteReminder(id) {
  if (!confirm('Delete this reminder?')) return;
  await fetch(API + `/api/reminders/${id}`, {method: 'DELETE'});
  await loadReminders();
}

// ─── Research ─────────────────────────────────────────────────────────────────
async function loadResearch() {
  const res = await fetch(API + '/api/research');
  const entries = await res.json();
  renderResearch(entries);
}

function renderResearch(entries) {
  const list = document.getElementById('research-list');
  if (entries.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>No research yet. Type a topic above and click Research.</div>';
    return;
  }
  list.innerHTML = entries.map(e => `
    <div class="research-entry">
      <div class="research-query">🔍 ${esc(e.query)}</div>
      <div class="research-summary">${esc(e.summary)}</div>
      <div class="research-date">${fmtDateTime(e.created_at)}
        <button class="icon-btn danger" style="margin-left:8px" onclick="deleteResearch(${e.id})">🗑</button>
      </div>
    </div>`).join('');
}

async function doResearch() {
  const input = document.getElementById('research-input');
  const query = input.value.trim();
  if (!query) return;
  input.disabled = true;
  const list = document.getElementById('research-list');
  list.insertAdjacentHTML('afterbegin', `
    <div class="research-loading" id="research-spinner">
      <span class="spinner"></span>Researching "${esc(query)}"...
    </div>`);
  try {
    const res = await fetch(API + '/api/research', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({query}),
    });
    const entry = await res.json();
    document.getElementById('research-spinner')?.remove();
    input.value = '';
    await loadResearch();
  } catch {
    document.getElementById('research-spinner').textContent = 'Error — is the API key set?';
  }
  input.disabled = false;
}

async function deleteResearch(id) {
  await fetch(API + `/api/research/${id}`, {method: 'DELETE'});
  await loadResearch();
}

// ─── Chat ─────────────────────────────────────────────────────────────────────
async function loadChat() {
  const res = await fetch(API + '/api/chat/history');
  const history = await res.json();
  const container = document.getElementById('chat-messages');
  if (history.length > 0) {
    container.innerHTML = history.map(m => chatBubble(m.role, m.content)).join('');
    scrollChat();
  }
}

function chatBubble(role, content, action) {
  const actionHtml = action ? `<div class="action-notice">✓ Action applied: ${esc(action.action.replace('_', ' '))}</div>` : '';
  return `<div class="chat-msg ${role}">
    <div class="msg-avatar">${role === 'user' ? '👤' : '🤖'}</div>
    <div><div class="msg-bubble">${esc(content)}</div>${actionHtml}</div>
  </div>`;
}

function scrollChat() {
  const c = document.getElementById('chat-messages');
  c.scrollTop = c.scrollHeight;
}

let chatSending = false;
async function sendChat() {
  if (chatSending) return;
  const input = document.getElementById('chat-input');
  const message = input.value.trim();
  if (!message) return;
  chatSending = true;
  input.value = '';
  const container = document.getElementById('chat-messages');
  container.insertAdjacentHTML('beforeend', chatBubble('user', message));
  container.insertAdjacentHTML('beforeend', `<div class="chat-msg assistant" id="typing-indicator"><div class="msg-avatar">🤖</div><div class="msg-bubble" style="color:var(--muted)"><span class="spinner"></span>Thinking...</div></div>`);
  scrollChat();

  try {
    const res = await fetch(API + '/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message}),
    });
    const data = await res.json();
    document.getElementById('typing-indicator')?.remove();
    container.insertAdjacentHTML('beforeend', chatBubble('assistant', data.response, data.action));
    scrollChat();
    if (data.action) {
      await loadTasks();
      await loadReminders();
    }
  } catch {
    document.getElementById('typing-indicator').querySelector('.msg-bubble').textContent = 'Error contacting server.';
  }
  chatSending = false;
}

// ─── Modals ───────────────────────────────────────────────────────────────────
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

// ─── Helpers ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function fmtDateTime(iso) {
  return new Date(iso).toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

// ─── Init ─────────────────────────────────────────────────────────────────────
document.getElementById('topbar-date').textContent = new Date().toLocaleDateString(undefined, {weekday:'long', year:'numeric', month:'long', day:'numeric'});
loadDashboard();
</script>
